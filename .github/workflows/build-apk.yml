name: Build Native WebView APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target website URL'
        required: true
        type: string
      app_name:
        description: 'App display name'
        required: true
        default: 'MyApp'
        type: string
      app_color:
        description: 'Theme color hex (e.g. #22c55e)'
        required: true
        default: '#22c55e'
        type: string
      package_id:
        description: 'Android package ID'
        required: true
        default: 'com.webtoapp.app'
        type: string
      admob_enabled:
        description: 'Enable AdMob (true/false)'
        required: false
        default: 'false'
        type: string
      admob_app_id:
        description: 'AdMob App ID'
        required: false
        default: 'ca-app-pub-3940256099942544~3347511713'
        type: string
      admob_banner_id:
        description: 'AdMob Banner Unit ID'
        required: false
        default: ''
        type: string
      admob_interstitial_id:
        description: 'AdMob Interstitial Unit ID'
        required: false
        default: ''
        type: string
      admob_inter_freq:
        description: 'Interstitial frequency (every N page loads)'
        required: false
        default: '3'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-read-only: false

      - name: Configure app parameters
        working-directory: android-template
        run: |
          set -e
          APP_URL="${{ inputs.app_url }}"
          APP_NAME="${{ inputs.app_name }}"
          APP_COLOR="${{ inputs.app_color }}"
          PACKAGE_ID="${{ inputs.package_id }}"
          ADMOB_ENABLED_V="${{ inputs.admob_enabled }}"
          ADMOB_APP_ID_V="${{ inputs.admob_app_id }}"
          ADMOB_BANNER_ID_V="${{ inputs.admob_banner_id }}"
          ADMOB_INTERSTITIAL_ID_V="${{ inputs.admob_interstitial_id }}"
          ADMOB_INTER_FREQ_V="${{ inputs.admob_inter_freq }}"

          # Fallback: AdMob APP_ID must never be empty or SDK crashes
          if [ -z "$ADMOB_APP_ID_V" ]; then
            ADMOB_APP_ID_V="ca-app-pub-3940256099942544~3347511713"
          fi
          [ -z "$ADMOB_ENABLED_V" ] && ADMOB_ENABLED_V="false"
          [ -z "$ADMOB_INTER_FREQ_V" ] && ADMOB_INTER_FREQ_V="3"

          # Escape special characters for sed
          esc() { printf '%s\n' "$1" | sed 's/[&/\]/\\&/g'; }
          APP_URL_ESC=$(esc "$APP_URL")
          APP_NAME_ESC=$(esc "$APP_NAME")
          APP_COLOR_ESC=$(esc "$APP_COLOR")
          PACKAGE_ID_ESC=$(esc "$PACKAGE_ID")
          ADMOB_ENABLED_ESC=$(esc "$ADMOB_ENABLED_V")
          ADMOB_APP_ID_ESC=$(esc "$ADMOB_APP_ID_V")
          ADMOB_BANNER_ID_ESC=$(esc "$ADMOB_BANNER_ID_V")
          ADMOB_INTERSTITIAL_ID_ESC=$(esc "$ADMOB_INTERSTITIAL_ID_V")
          ADMOB_INTER_FREQ_ESC=$(esc "$ADMOB_INTER_FREQ_V")

          FILES=$(find . -type f \( -name "*.java" -o -name "*.xml" -o -name "*.gradle" \))

          # Order matters: replace longer/specific tokens BEFORE shorter prefixes.
          for f in $FILES; do
            sed -i "s|ADMOB_INTERSTITIAL_ID|${ADMOB_INTERSTITIAL_ID_ESC}|g" "$f"
            sed -i "s|ADMOB_BANNER_ID|${ADMOB_BANNER_ID_ESC}|g" "$f"
            sed -i "s|ADMOB_INTER_FREQ|${ADMOB_INTER_FREQ_ESC}|g" "$f"
            sed -i "s|ADMOB_ENABLED|${ADMOB_ENABLED_ESC}|g" "$f"
            sed -i "s|ADMOB_APP_ID|${ADMOB_APP_ID_ESC}|g" "$f"
            sed -i "s|APP_PACKAGE_ID|${PACKAGE_ID_ESC}|g" "$f"
            sed -i "s|APP_URL|${APP_URL_ESC}|g" "$f"
            sed -i "s|APP_NAME|${APP_NAME_ESC}|g" "$f"
            sed -i "s|APP_COLOR|${APP_COLOR_ESC}|g" "$f"
          done

      - name: Generate app icons
        working-directory: android-template
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

          if [ -f "custom_icon.png" ]; then
            echo "✅ Using custom icon from custom_icon.png"
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi) SIZE=48 ;;
                hdpi) SIZE=72 ;;
                xhdpi) SIZE=96 ;;
                xxhdpi) SIZE=144 ;;
                xxxhdpi) SIZE=192 ;;
              esac
              DIR="app/src/main/res/mipmap-${density}"
              mkdir -p "$DIR"
              convert "custom_icon.png" -resize "${SIZE}x${SIZE}!" "${DIR}/ic_launcher.png"
            done
          else
            echo "ℹ️ No custom icon found, generating letter-based icon"
            COLOR="${{ inputs.app_color }}"
            NAME="${{ inputs.app_name }}"
            LETTER=$(echo "$NAME" | head -c 1 | tr '[:lower:]' '[:upper:]')

            if [ -z "$LETTER" ] || ! echo "$LETTER" | grep -qE '^[A-Za-z0-9]$'; then
              LETTER="A"
            fi

            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi) SIZE=48 ;;
                hdpi) SIZE=72 ;;
                xhdpi) SIZE=96 ;;
                xxhdpi) SIZE=144 ;;
                xxxhdpi) SIZE=192 ;;
              esac
              DIR="app/src/main/res/mipmap-${density}"
              mkdir -p "$DIR"
              convert -size "${SIZE}x${SIZE}" xc:"${COLOR}" \
                -gravity center -pointsize $((SIZE * 45 / 100)) \
                -fill white -font DejaVu-Sans-Bold -annotate 0 "${LETTER}" \
                "${DIR}/ic_launcher.png"
            done
          fi

      - name: Build debug APK
        working-directory: android-template
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace --info

      - name: Rename and prepare APK
        run: |
          set -e
          APP_NAME="${{ inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '-' | tr -cd '[:alnum:]-' | head -c 50)
          [ -z "$SAFE_NAME" ] && SAFE_NAME="app"
          APK_PATH=$(find android-template/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          cp "$APK_PATH" "android-template/${SAFE_NAME}.apk"
          echo "APK_FILE=${SAFE_NAME}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-apk
          path: android-template/${{ env.APK_FILE }}
          retention-days: 7
